<div id="app-container">
  <dx-data-grid
    #mainGrid
    id="grid-container"
    [dataSource]="dataSource"
    [showBorders]="true"
    [repaintChangesOnly]="true"
    (onEditorPreparing)="onEditorPreparing($event)"
    (onEditingStart)="onEditingStart($event)"
    (onInitNewRow)="onInitNewRow($event)"
    (onSaving)="onSaving($event)"
  >
    <dxo-editing
      mode="popup"
      [allowUpdating]="true"
      [allowAdding]="true"
      [allowDeleting]="true"
    >
      <dxo-popup
        [showTitle]="true"
        [width]="800"
        [height]="400"
        title="Employee"
      >
        <dxi-toolbar-item
          widget="dxButton"
          location="after"
          toolbar="bottom"
          [options]="submitButtonOptions"
        >
        </dxi-toolbar-item>
        <dxi-toolbar-item
          widget="dxButton"
          location="after"
          toolbar="bottom"
          [options]="cancelButtonOptions"
        >
        </dxi-toolbar-item>
      </dxo-popup>
      <dxo-form [colCount]="1"> </dxo-form>
    </dxo-editing>

    <dxi-column
      dataField="Name"
      caption="Employee Name"
      [setCellValue]="setCellValue"
    >
      <dxi-validation-rule type="required" message="Employee Name is required!">
      </dxi-validation-rule>
    </dxi-column>

    <dxi-column
      dataField="Subjects"
      caption="Subjects"
      [allowSorting]="false"
      [customizeText]="customizeText"
      editCellTemplate="subjectEditor"
    >
    </dxi-column>

    <div *dxTemplate="let cellInfo of 'subjectEditor'">
      <dx-data-grid
        [dataSource]="subjects"
        [height]="250"
        keyExpr="SubjectCode"
        (onRowValidating)="onRowValidating($event)"
        (onRowRemoved)="onRowRemoved($event)"
        (onEditorPreparing)="onEditorPreparingSub($event)"
      >
        <dxi-column
          dataField="SubjectCode"
          caption="Subject Code"
          [setCellValue]="setCellValue"
        >
          <dxi-validation-rule
            type="required"
            message="Subject Code is required"
          >
          </dxi-validation-rule>
        </dxi-column>

        <dxi-column
          dataField="SubjectName"
          caption="Subject Name"
          [setCellValue]="setCellValue"
        >
          <dxi-validation-rule
            type="required"
            message="Subject Name is required"
          >
          </dxi-validation-rule>
        </dxi-column>

        <dxi-column
          dataField="Section"
          caption="Section"
          [setCellValue]="setCellValue"
        >
          <dxi-validation-rule type="required" message="Section is required">
          </dxi-validation-rule>
        </dxi-column>

        <dxo-editing
          mode="row"
          [allowDeleting]="true"
          [allowAdding]="true"
          [allowUpdating]="true"
        >
        </dxo-editing>
      </dx-data-grid>
    </div>
  </dx-data-grid>
</div>
